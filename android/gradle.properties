org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# 여기 값들만 바꾸면 됩니다. (실서비스 전환 체크리스트)
# 자세한 설명: docs/ANDROID_HIVE_GUIDE.md
# ---------------------------------------------------------------------------

# 앱 패키지명 / 버전
nextstop.applicationId=com.station.nextstop
nextstop.versionCode=1
nextstop.versionName=1.0.0

# --- AdMob -----------------------------------------------------------------
# 비워두면 구글 공식 "테스트 광고" ID 가 자동으로 쓰입니다.
# 실제 광고를 내보내려면 AdMob 콘솔에서 발급받은 값을 채우세요.
admob.appId=
admob.rewardedUnitId=
admob.interstitialUnitId=

# --- Hive ------------------------------------------------------------------
# Hive 콘솔에서 발급받은 AppID. 비워두면 Hive 로그인 기능이 꺼진 채로 빌드됩니다.
hive.appId=com.station.nextstop
# REAL 또는 SANDBOX. Hive SDK 의 Configuration.ZoneType 값입니다.
# 중요: 앱을 등록한 콘솔과 반드시 맞춰야 합니다. 두 존은 서버가 완전히 분리돼 있어서,
#       일반(real) 콘솔에 등록한 앱은 sandbox 서버가 알지 못하고 setup 이 실패합니다.
hive.zone=REAL
# Google 로그인을 쓸 때만 필요 (GCP OAuth 웹 클라이언트 ID)
hive.googleServerClientId=
